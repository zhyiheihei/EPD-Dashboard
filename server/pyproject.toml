[project]
name = "epd-food-server"
version = "0.1.0"
description = "家庭食品存储看板服务端：REST API + PostgreSQL + BLE 推送墨水屏"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "psycopg[binary]>=3.1",
    "pillow>=10.0",
    "bleak>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
epd-food-server = "epd_food_server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["epd_food_server"]
